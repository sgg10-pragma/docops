providers:
  azdo:
    type: azure_devops_wiki
    organization: <your_organization>
    project: <your_project>
    wiki: <your_wiki>.wiki
    pat_token_env: AZDO_PAT
    api_version: "7.1"
    timeout_seconds: 30

profiles:
  default:
    provider: azdo
    refs:
      docs_root:
        provider: azdo
        kind: path
        locator:
          path: /Your/Root/Page
    # Add plugin-specific config only when the workflow actually needs it.
    # Prefer plugin defaults unless you intentionally want to override them.
